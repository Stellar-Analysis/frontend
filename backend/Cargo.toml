[package]
name = "stellar-insights-backend"
version = "0.1.0"
edition = "2021"
description = "Backend services for Stellar Insights (pagination and related modules)"
license = "MIT OR Apache-2.0"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
