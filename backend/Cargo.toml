[package]
name = "stellar-insights-backend"
version = "0.1.0"
edition = "2021"
description = "Backend services for Stellar Insights (webhooks and related modules)"
license = "MIT OR Apache-2.0"

[dependencies]
hex = "0.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
