name: Clippy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    # Issue #127: panic-prevention lints (unwrap_used, expect_used, panic) are
    # configured as `warn` in backend/Cargo.toml. We promote them to `deny`
    # ONLY for `--lib` (production code). Tests are allowed to keep `.unwrap()`
    # / `.expect()` / `panic!` because they are the idiomatic way to express
    # preconditions and assertions in unit tests.
    - name: "Backend Clippy (lib: deny panic-lints; tests: warn)"
      working-directory: ./backend
      run: |
        cargo clippy --lib -- \
          -W clippy::all \
          -D clippy::unwrap_used \
          -D clippy::expect_used \
          -D clippy::panic
        cargo clippy --tests -- -W clippy::all

    - name: Contracts Clippy
      working-directory: ./contracts
      run: cargo clippy --all-targets --all-features -- -W clippy::all
      continue-on-error: true
